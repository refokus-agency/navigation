# AI code review on demand — comment "@claude review" on a pull request.
#
# Every gate (trigger phrase, actor permissions, bot filter, fork head,
# pull request state) lives inside the reusable, so this caller filters
# nothing beyond the event itself.
#
# Three deliberate deviations from the other callers in this repo:
#
# 1. Secrets are mapped EXPLICITLY rather than blanket-inherited. This job
#    runs on a comment, an event any org member can fire, so it gets exactly
#    the one credential it needs and nothing else. Do not "fix" this back to
#    blanket inheritance.
# 2. `id-token: write` is required on EVERY run — keep it, and know why.
#    It is NOT for the Anthropic credential: the reusable passes no
#    `github_token`, so claude-code-action's setupGitHubToken() falls through
#    to core.getIDToken() and trades it for the GitHub App token the action
#    uses to read the PR and post the review. Remove it and every review dies
#    red with "Could not fetch an OIDC token" — not a green skip.
#    Separately, the Anthropic federation path (setupWorkloadIdentity()) IS
#    dormant while ANTHROPIC_API_KEY is set: it returns early before
#    core.getIDToken(). That path matters on credential rotation: the
#    reusable's "Resolve auth" gate also passes on the federation vars alone
#    (they default to the org's ANTHROPIC_FEDERATION_RULE_ID /
#    ANTHROPIC_ORG_ID), so if the API key is rotated out while those vars
#    exist, the job proceeds into federation, which needs this same grant.
# 3. The reusable is pinned to an EXACT version, not the floating `@v1` that
#    `pr-ci.yml` uses. This caller is the only one in the repo that hands a
#    credential to a comment-triggered job, so upstream must not change what
#    runs with that credential without a commit here. v1.11.0 is commit
#    7a6fe894f7f8383aed085de279a5f91e7e3c182c — recorded because a tag is
#    mutable. Bump deliberately; re-check the reusable's secret interface
#    when you do.
#
#    The pin is TWO lines, not one. `platform-ref` below defaults to `main`,
#    and the reusable checks platform out a SECOND time at that ref to run
#    the guard script that `Verify review outcome` EXECUTES from disk. Left
#    at its default it would pull that script from a floating branch,
#    defeating the whole point of the exact pin above. Dependabot bumps
#    `uses:` only, so the `with:` line is a manual edit every time — the two
#    must never drift apart.

name: Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  code-review:
    uses: refokus-agency/platform/.github/workflows/code-review.yml@v1.11.0
    with:
      # Must move together with the `uses:` ref above — see deviation 3.
      platform-ref: v1.11.0
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
