# CI + semantic-release on push to main (for npm libraries).
# Copy to .github/workflows/main-release.yml in your repo.
#
# workflow_dispatch is kept as an escape hatch — lets you re-run a
# release from the Actions tab without pushing a new commit.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: refokus-agency/platform/.github/workflows/ci.yml@v1
    secrets: inherit

  release:
    needs: ci
    uses: refokus-agency/platform/.github/workflows/release.yml@v1.4.0
    with:
      registry: npm
      # @semantic-release/npm gained OIDC Trusted Publishing support in v13, which ships
      # with semantic-release v25. The platform reusable workflow defaults to v24 (npm
      # plugin v12), whose verifyConditions aborts with ENONPMTOKEN before the npm CLI can
      # do the OIDC exchange. Pin v25 on the npm registry path.
      semantic-release-version: '25'
    secrets: inherit
