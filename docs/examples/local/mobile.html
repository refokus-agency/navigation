<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mobile menu — local example</title>

<script type="importmap">
{ "imports": { "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/+esm" } }
</script>

<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0e1116; --panel: #171c24; --line: #2a323d;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --ok: #3fb950;
  }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  /* ---------- the nav under test ---------- */
  [data-nav-menu] {
    position: fixed; inset: 0 0 auto 0; z-index: 50;
    display: flex; align-items: center; gap: 8px;
    padding: 14px 20px;
    background: rgba(23,28,36,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 650; margin-right: 18px; letter-spacing: -.01em; }

  [data-nav-list] { display: flex; align-items: center; gap: 4px; }
  [data-nav-item] { position: relative; }

  [data-nav-trigger], [data-nav-link], [data-nav-toggle] {
    appearance: none; background: none; border: 0; cursor: pointer;
    color: var(--text); font: inherit; text-decoration: none;
    padding: 8px 12px; border-radius: 8px;
  }
  [data-nav-trigger]:hover, [data-nav-link]:hover, [data-nav-toggle]:hover { background: #212936; }
  [data-nav-trigger]:focus-visible, [data-nav-link]:focus-visible,
  [data-nav-toggle]:focus-visible, [data-nav-content] a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  /* [data-state] is set by the library */
  [data-nav-trigger][data-state='open'] { background: #263041; color: var(--accent); }

  /* Desktop: panels are in-item dropdowns. top/left only — never an imposed size. */
  [data-nav-content] {
    position: absolute; top: calc(100% + 8px); left: 0;
    width: max-content; padding: 12px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  [data-nav-content] a { display: block; padding: 8px 10px; border-radius: 7px;
    color: var(--text); text-decoration: none; white-space: nowrap; }
  [data-nav-content] a:hover { background: #212936; color: var(--accent); }

  @keyframes panelIn  { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform:none; } }
  @keyframes panelOut { from { opacity:1; transform:none; } to { opacity:0; transform: translateY(-6px); } }
  [data-nav-content][data-state='open']   { animation: panelIn  .20s ease both; }
  [data-nav-content][data-state='closed'] { animation: panelOut .16s ease both; }

  /* ---------- mobile: toggle + card + accordion ---------- */
  [data-nav-toggle] { display: none; margin-left: auto; border: 1px solid var(--line); }
  [data-nav-toggle][aria-expanded='true'] { background: #263041; color: var(--accent); }

  @keyframes cardIn  { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform:none; } }
  @keyframes cardOut { from { opacity:1; transform:none; } to { opacity:0; transform: translateY(-8px); } }

  @media (max-width: 767px) {
    [data-nav-toggle] { display: inline-flex; }

    [data-nav-card] {
      position: absolute; top: calc(100% + 8px); left: 12px; right: 12px;
      padding: 10px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
    }
    [data-nav-card][data-state='open']   { animation: cardIn  .2s ease both; }
    /* Closed: hidden and inert (the library sets inert). */
    [data-nav-card][data-state='closed'] { display: none; }

    [data-nav-list] { flex-direction: column; align-items: stretch; }
    [data-nav-trigger], [data-nav-link] { display: block; width: 100%; text-align: left; }

    /* Accordion: panels flow inline under their trigger. */
    [data-nav-content] {
      position: static; width: auto; margin: 2px 0 6px;
      box-shadow: none; background: #1c2230;
    }
    [data-nav-item][data-state='open'] > [data-nav-trigger] { color: var(--accent); }
  }

  /* ---------- page + inspector ---------- */
  main { max-width: 620px; margin: 0 auto; padding: 120px 20px 60px; }
  h1 { font-size: 22px; letter-spacing: -.02em; }
  code, kbd { background: #1c2230; border: 1px solid var(--line);
       border-radius: 5px; padding: 1px 5px; font-size: 12.5px; }
  .tall { height: 100vh; display: grid; place-items: center;
       border: 1px dashed var(--line); border-radius: 12px; color: var(--dim); }

  #inspector {
    position: fixed; right: 16px; bottom: 16px; width: 280px; max-height: 40vh;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    z-index: 40;
  }
  #inspector header { padding: 9px 12px; border-bottom: 1px solid var(--line);
    color: var(--dim); text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; }
  #log { margin: 0; padding: 10px 12px; overflow: auto; color: var(--dim); }
  #log div { white-space: pre; }
  #log div:first-child { color: var(--ok); }
</style>
</head>
<body>

<nav data-nav-menu>
  <span class="brand">Acme</span>
  <button type="button" data-nav-toggle>Menu</button>
  <div data-nav-card>
    <div data-nav-list>
      <div data-nav-item="products">
        <button type="button" data-nav-trigger>Products</button>
        <div data-nav-content>
          <a href="#p1">Product 1</a><a href="#p2">Product 2</a><a href="#p3">Product 3</a>
        </div>
      </div>
      <div data-nav-item="company">
        <button type="button" data-nav-trigger>Company</button>
        <div data-nav-content>
          <a href="#c1">About</a><a href="#c2">Careers</a>
        </div>
      </div>
      <div data-nav-item="plain"><a data-nav-link href="#plain">Pricing</a></div>
    </div>
  </div>
</nav>

<main>
  <h1>Mobile menu</h1>
  <p>Resize below <code>768px</code>. Try the toggle, <kbd>Esc</kbd>, an outside click
     (this text) and opening two accordion panels in a row.</p>
  <div class="tall">page content</div>
</main>

<aside id="inspector">
  <header>events</header>
  <div id="log"></div>
</aside>

<script type="module">
  import { initNavigationMenu } from '../../../dist/navigation.browser.js';

  const log = document.getElementById('log');
  const line = (msg) => {
    const el = document.createElement('div');
    el.textContent = `${new Date().toLocaleTimeString('en-GB')}  ${msg}`;
    log.prepend(el);
    while (log.children.length > 40) log.lastChild.remove();
  };

  initNavigationMenu('[data-nav-menu]', {
    onValueChange: (value) => line(`value → ${value}`),
  });

  const card = document.querySelector('[data-nav-card]');
  new MutationObserver(() => line(`card → ${card.dataset.state}`))
    .observe(card, { attributes: true, attributeFilter: ['data-state'] });
</script>
</body>
</html>
